name: Validate Infrastructure Code

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'templates/**.bicep'
      - 'schemas/**.json'
      - 'tests/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'templates/**.bicep'
      - 'schemas/**.json'
      - 'tests/**'
      - '.github/workflows/validate.yml'

jobs:
  validate-bicep:
    name: Validate Bicep Templates
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC federated credential login
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        continue-on-error: true

      - name: Install Bicep CLI
        run: |
          az --version
          az bicep install
          az bicep version

      - name: Build Bicep Templates
        run: |
          echo "🔨 Building Bicep templates..."
          for file in templates/*.bicep; do
            if [ -f "$file" ]; then
              echo "Building: $file"
              az bicep build --file "$file"
              if [ $? -eq 0 ]; then
                echo "✅ Successfully built: $file"
              else
                echo "❌ Failed to build: $file"
                exit 1
              fi
            fi
          done

      - name: Lint Bicep Templates
        run: |
          echo "🔍 Linting Bicep templates..."
          for file in templates/*.bicep; do
            if [ -f "$file" ]; then
              echo "Linting: $file"
              az bicep lint --file "$file"
            fi
          done
        continue-on-error: true

      - name: Validate ARM Deployments (dry-run)
        run: |
          echo "🧪 Validating compiled ARM templates..."
          if az account show > /dev/null 2>&1; then
            for file in templates/*.bicep; do
              if [ -f "$file" ]; then
                arm_file="${file%.bicep}.json"
                if [ -f "$arm_file" ]; then
                  echo "Validating: $arm_file"
                  az deployment group validate \
                    --resource-group "${{ vars.AZURE_RESOURCE_GROUP || 'bicep-rg' }}" \
                    --template-file "$arm_file" \
                    --no-prompt \
                    || echo "⚠️ Dry-run validation skipped for $arm_file (resource group may not exist)"
                fi
              fi
            done
          else
            echo "⚠️ Azure login unavailable – skipping deployment dry-run validation"
          fi
        continue-on-error: true

  validate-schemas:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON Schemas
        run: npm run test:schemas

      - name: Check JSON formatting
        run: |
          echo "📝 Checking JSON formatting..."
          for file in schemas/*.json; do
            if [ -f "$file" ]; then
              echo "Checking: $file"
              python3 -m json.tool "$file" > /dev/null
              if [ $? -eq 0 ]; then
                echo "✅ Valid JSON: $file"
              else
                echo "❌ Invalid JSON: $file"
                exit 1
              fi
            fi
          done

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-bicep, validate-schemas, security-scan]
    if: always()
    steps:
      - name: Check validation results
        run: |
          echo "📊 Validation Summary"
          echo "===================="
          echo "Bicep validation: ${{ needs.validate-bicep.result }}"
          echo "Schema validation: ${{ needs.validate-schemas.result }}"
          echo "Security scan: ${{ needs.security-scan.result }}"

          if [ "${{ needs.validate-bicep.result }}" != "success" ] || [ "${{ needs.validate-schemas.result }}" != "success" ]; then
            echo "❌ Validation failed"
            exit 1
          fi

          echo "✅ All validations passed"
